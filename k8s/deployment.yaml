apiVersion: apps/v1
kind: Deployment

metadata:
  name: brain-tasks-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: brain-tasks-app

  template:
    metadata:
      labels:
        app: brain-tasks-app

    spec:
      containers:
        - name: brain-tasks-app

          image: 281633885909.dkr.ecr.us-east-1.amazonaws.com/brain-tasks-app:latest

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

